plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'ecommerce'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Mustache - template engine
    implementation 'org.springframework.boot:spring-boot-starter-mustache'

    // Spring Web MVC - for building web applications
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Spring Data JPA - for database access
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Flyway - for database migrations
    implementation 'org.flywaydb:flyway-core'

    // H2 Database - in-memory database for development and testing
    runtimeOnly 'com.h2database:h2'

    // PostgreSQL Driver - for connecting to PostgreSQL database
    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-mustache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // HtmlUnit - for testing HTML output
    testImplementation  'net.sourceforge.htmlunit:htmlunit:3.11.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
